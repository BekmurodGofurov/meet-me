server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to
    # index.html (there's no client-side router today, but this is the
    # standard safe default and costs nothing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames from the Vite build (index-XXXX.js/css) are safe to
    # cache aggressively; index.html itself must not be, or a redeploy
    # wouldn't be picked up by returning visitors.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
