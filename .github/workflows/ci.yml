name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      # signaling.test.js exercises signaling.js directly, not server.js (the
      # thin http/https entry point) - this catches the class of bug those
      # tests can't: the entry point itself failing to boot.
      - name: Smoke-test the real entry point boots and responds
        working-directory: backend
        # E2E=1 forces plain http regardless of whether a cert happens to be
        # present, so this curl check is deterministic either way.
        env:
          E2E: '1'
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Server responded"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server never responded on port 8080"
          kill $SERVER_PID
          exit 1

  frontend:
    name: Frontend (lint + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run linter
        working-directory: client
        run: npm run lint

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # --with-deps also installs the OS-level media/codec libraries that
      # --use-fake-device-for-media-stream needs to work headlessly.
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # No mkcert certs exist in CI - E2E=1 (set in playwright.config.js's
      # webServer env) makes both servers fall back to plain http/ws on
      # localhost, which is exactly the path this is meant to exercise.
      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    name: Continuous Deployment to AWS EC2
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and update app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /home/admin/projects/meet-me
            git pull origin main

            # NVM / Node muhitini yuklash (mavjud bo'lmasa ham xato bermasligi uchun || true)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            cd client
            npm i
            npm run build
            sudo mkdir -p /var/www/meet-me-frontend
            sudo rm -rf /var/www/meet-me-frontend/*
            sudo cp -r dist/* /var/www/meet-me-frontend/
            cd ..

            docker compose up -d --build

            sudo systemctl reload nginx

