server {
    listen 80;
    server_name meet-me.bekmurod.uz;

    root /var/www/meet-me-frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Security headers. "always" so they're also sent on error responses.
    # - CSP: only this site's own scripts/styles; the WebSocket is the only
    #   other connection the page makes. React sets style attributes through
    #   the DOM, which CSP allows; 'unsafe-inline' covers any inline <style>.
    # - frame-ancestors / X-Frame-Options: no other site can embed the call
    #   page in an iframe (and trick people into granting camera access).
    # - Permissions-Policy: camera, mic and screen capture only for this site.
    # HSTS only takes effect once this is served over https (certbot's 443
    # block inherits nothing from here - copy these lines there too).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://meet-me.bekmurod.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite puts a content hash in every asset filename, so they can be cached
    # forever - a new build gets new names. (add_header inside a location
    # replaces the server-level ones, so the security headers are repeated.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html must always be revalidated, or users keep loading an
        # old page that points at assets a new deploy has deleted.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://meet-me.bekmurod.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket signaling - same origin/domain as the frontend, no separate
    # public port needed. The Upgrade/Connection headers are what make this
    # a WebSocket proxy instead of a normal HTTP one.
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The backend's per-IP rate limits need the real client address;
        # without this every connection looks like 127.0.0.1. Used only
        # because TRUST_PROXY=1 is set for the backend container.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
}
