services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"

  client:
    build: ./client
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      # Falls back to localhost (self-signed via Caddy's internal CA) if no
      # .env sets a real DOMAIN, instead of silently becoming an empty
      # string - which breaks Caddyfile parsing in a confusing way.
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - client

volumes:
  caddy_data:
  caddy_config:
